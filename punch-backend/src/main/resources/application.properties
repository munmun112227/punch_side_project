spring.application.name=punch-backend

# Database Configuration (Development - Please replace for production)
spring.datasource.url=jdbc:postgresql://localhost:5432/punchdb
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# RSA Key Paths
rsa.private-key.path=keys/private.pem
rsa.public-key.path=keys/public.pem

# CORS Configuration (Allowed frontend origin)
cors.allowed-origin=http://localhost:5173
